apis:
- name: CDC WONDER API
  description: >-
    The CDC WONDER (Wide-ranging Online Data for Epidemiologic Research) API enables automated data queries
    in XML format over HTTP. Supports access to online databases covering mortality, natality, cancer
    statistics, AIDS/HIV, tuberculosis, sexually transmitted diseases, and environmental health data.
    Requests are HTTP POST to the WONDER controller endpoint with XML parameters; responses are returned
    as XML.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://wonder.cdc.gov
  baseURL: https://wonder.cdc.gov/controller/datarequest
  tags:
  - Disease Surveillance
  - Mortality
  - Epidemiology
  - Public Health
  properties:
  - type: Documentation
    url: https://wonder.cdc.gov/wonder/help/WONDER-API.html
  contact:
  - FN: CDC WONDER
    email: wonder@cdc.gov
- name: CDC Environmental Public Health Tracking Network API
  description: >-
    Allows querying of data from the CDC National Environmental Public Health Tracking Network. Returns
    JSON-formatted responses covering environmental health indicators such as air quality, water quality,
    climate data, and their associations with health outcomes across the United States.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://ephtracking.cdc.gov
  baseURL: https://ephtracking.cdc.gov/apigateway/api/v1
  tags:
  - Environmental Health
  - Air Quality
  - Water Quality
  - Climate
  - Public Health
  properties:
  - type: Documentation
    url: https://ephtracking.cdc.gov/apihelp
  contact:
  - FN: CDC Tracking
    email: trackingsupport@cdc.gov
- name: CDC Content Syndication API
  description: >-
    Enables CDC to offer web content to other sites and applications. Provides structured access to CDC
    health content including articles, health topics, media, and tools in JSON and XML formats for syndication
    to third-party websites and public health information systems.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://tools.cdc.gov/api/docs/info.aspx
  baseURL: https://tools.cdc.gov/api/v2
  tags:
  - Content
  - Health Information
  - Syndication
  properties:
  - type: Documentation
    url: https://tools.cdc.gov/api/docs/info.aspx#response
  contact:
  - FN: CDC Digital Media
    email: cdcinfo@cdc.gov
- name: PHIN VADS API
  description: >-
    The Public Health Information Network Vocabulary Access and Distribution System (PHIN VADS) is a web-based
    enterprise vocabulary system for accessing, searching, and distributing vocabularies used in public
    health and clinical care practice. Provides REST access to standardized code sets and value sets used
    in public health reporting.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://phinvads.cdc.gov
  baseURL: https://phinvads.cdc.gov/vocabService/v2
  tags:
  - Vocabulary
  - Terminology
  - Standards
  - Public Health
  properties:
  - type: Documentation
    url: https://phinvads.cdc.gov/vads/developersGuide.action
  contact:
  - FN: PHIN VADS Support
    email: phinvads@cdc.gov
